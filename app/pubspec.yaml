name: smartlocator_bluepixels
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.32.3
  intl: ^0.19.0
  firebase_core: ^4.5.0
  firebase_database: ^12.1.4
  firebase_auth: ^6.2.0
  firebase_storage: ^13.1.0      # ← changed from 12.3.7
  image_picker: ^1.1.2 
  permission_handler: ^11.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.66.0
  shared_preferences: ^2.2.2
  share_plus: ^10.1.2
  flutter_local_notifications: ^18.0.1
  pdf: ^3.10.8
  path_provider: ^2.1.2
  provider: ^6.1.2
  app_settings: ^5.1.1
  tutorial_coach_mark: ^1.2.11
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/smartlocator_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/bluetooth_scanner.png
    - assets/images/bluepixels_icon.png
    - assets/images/google_logo.png
    - assets/images/smartlocator_icon.png
    - assets/images/smartlocator_qr.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700